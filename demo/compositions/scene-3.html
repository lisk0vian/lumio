<!DOCTYPE html>
<html lang="en" data-composition-id="scene-3" data-composition-duration="5">
  <head>
    <meta charset="UTF-8">
    <title>Scene 3 — Level</title>
  </head>
  <body>
    <template>
      <div data-hf-id="hf-cur4" id="s3-root" data-composition-id="scene-3" data-duration="5" data-fps="30" data-width="1280" data-height="720">
        <style>
          #s3-root { position: absolute; inset: 0; overflow: hidden; padding: 100px 72px 96px; display: flex; flex-direction: column; justify-content: center; color: #191713; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
          .s3-eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 0.16em; color: #a44c1d; margin-bottom: 20px; }
          .s3-head { font-size: 60px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; }
          .s3-head em { font-style: normal; color: #a44c1d; }
          .s3-caption { font-size: 22px; line-height: 1.5; color: #66635a; margin-top: 18px; }
          .s3-scale { position: relative; margin-top: 88px; }
          .s3-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; height: 20px; }
          .s3-seg { border-radius: 6px; transform-origin: left center; }
          .s3-labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; }
          .s3-lab { display: grid; gap: 2px; }
          .s3-lab b { font-size: 22px; font-weight: 700; }
          .s3-lab span { font-size: 17px; color: #66635a; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
          .s3-marker { position: absolute; left: 0; top: 0; width: 0; }
          .s3-bubble { position: absolute; bottom: 22px; left: 0; white-space: nowrap; background: #191713; color: #faf9f4; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 20px; font-weight: 700; padding: 8px 14px; border-radius: 10px; font-variant-numeric: tabular-nums; }
          .s3-stem { position: absolute; left: -2px; top: -16px; width: 4px; height: 52px; border-radius: 2px; background: #191713; }
        </style>
        <div data-hf-id="hf-eolg" class="s3-eyebrow s3-rv">CONSUMPTION LEVEL</div>
        <div data-hf-id="hf-52sm" class="s3-head s3-rv">120 kWh is <em data-hf-id="hf-nu68">Normal</em>.</div>
        <div data-hf-id="hf-1slz" class="s3-caption s3-rv">Cross 70, 140 or 250 kWh and the level updates as you type.</div>
        <div data-hf-id="hf-mhuh" class="s3-scale" id="s3-scale">
          <div data-hf-id="hf-0wjm" class="s3-bar">
            <div data-hf-id="hf-y0ja" class="s3-seg" style="background: #ffc61a"></div>
            <div data-hf-id="hf-7m8w" class="s3-seg" style="background: #f5a623"></div>
            <div data-hf-id="hf-f465" class="s3-seg" style="background: #e8622c"></div>
            <div data-hf-id="hf-qlwi" class="s3-seg" style="background: #c23b2c"></div>
          </div>
          <div data-hf-id="hf-pxle" class="s3-labels">
            <div data-hf-id="hf-73fp" class="s3-lab"><b data-hf-id="hf-ybgh">Low</b><span data-hf-id="hf-56ya">&lt; 70</span></div>
            <div data-hf-id="hf-2d68" class="s3-lab" id="s3-active"><b data-hf-id="hf-fj9u">Normal</b><span data-hf-id="hf-ncos">70 – 140</span></div>
            <div data-hf-id="hf-3oft" class="s3-lab"><b data-hf-id="hf-snb1">High</b><span data-hf-id="hf-g9qy">140 – 250</span></div>
            <div data-hf-id="hf-4vcw" class="s3-lab"><b data-hf-id="hf-t31b">Very high</b><span data-hf-id="hf-uzyi">&gt; 250</span></div>
          </div>
          <div data-hf-id="hf-d65g" class="s3-marker" id="s3-marker" data-layout-allow-overlap="">
            <div data-hf-id="hf-38f0" class="s3-stem"></div>
            <div data-hf-id="hf-k19a" class="s3-bubble" id="s3-bubble">0 kWh</div>
          </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            'use strict';
            var FPS = 30;
            var bubble = document.getElementById('s3-bubble');
            // Equal-width bands, like the app: 120 sits 50/70 of the way through "Normal".
            var SEG = (1136 - 18) / 4, GAP = 6;
            var target = SEG + GAP + SEG * (50 / 70);
            var lowLabs = '#s3-root .s3-lab:not(#s3-active) b';

            gsap.set('#s3-root .s3-rv', { opacity: 0, y: 20 });
            gsap.set('#s3-root .s3-seg', { scaleX: 0 });
            gsap.set('#s3-root .s3-lab', { opacity: 0, y: 10 });
            gsap.set('#s3-marker', { opacity: 0, x: 0 });
            gsap.set('#s3-bubble', { xPercent: -50 });

            var tl = gsap.timeline({ paused: true });
            tl.to('#s3-root .s3-rv', { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', stagger: 0.1 }, 0.15);
            tl.to('#s3-root .s3-seg', { scaleX: 1, duration: 0.45, ease: 'power2.out', stagger: 0.1 }, 0.5);
            tl.to('#s3-root .s3-lab', { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out', stagger: 0.08 }, 0.7);

            // Marker travels from 0 to 120 kWh; its readout counts in lockstep with position.
            var MOVE_AT = 1.3, MOVE_DUR = 1.4;
            var ease = gsap.parseEase('power3.inOut');
            tl.to('#s3-marker', { opacity: 1, duration: 0.2 }, MOVE_AT - 0.1);
            tl.to('#s3-marker', { x: target, duration: MOVE_DUR, ease: 'power3.inOut' }, MOVE_AT);
            var last = Math.round(MOVE_DUR * FPS);
            for (var f = 0; f <= last; f += 1) {
              var p = ease(f / last);
              var px = target * p;
              // Map pixel position back to kWh per band so the number never disagrees with the bar.
              var kwh = px < SEG ? 70 * px / SEG : 70 + 70 * (px - SEG - GAP) / SEG;
              tl.set(bubble, { textContent: Math.max(0, Math.round(f === last ? 120 : kwh)) + ' kWh' }, MOVE_AT + MOVE_DUR * (f / last));
            }

            // Land: emphasize the active band, recede the others (text stays, color isn't the only cue).
            tl.to(lowLabs, { color: '#66635a', duration: 0.3 }, MOVE_AT + MOVE_DUR);
            tl.to('#s3-active b', { color: '#a44c1d', duration: 0.3 }, MOVE_AT + MOVE_DUR);
            tl.fromTo('#s3-bubble', { scale: 1 }, { scale: 1.12, duration: 0.15, ease: 'power2.out' }, MOVE_AT + MOVE_DUR);
            tl.to('#s3-bubble', { scale: 1, duration: 0.25, ease: 'power2.inOut' }, MOVE_AT + MOVE_DUR + 0.15);

            tl.to('#s3-root .s3-rv, #s3-scale', { opacity: 0, y: -24, duration: 0.4, ease: 'power2.in', stagger: 0.04 }, 4.5);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines['scene-3'] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
